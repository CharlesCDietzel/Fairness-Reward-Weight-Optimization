# W&B sweep: tunes Superhuman Fairness Neural Network.
#
# Run this sweep for every selected dataset, and write its best values to
# configs/tuned_hyperparameters.yaml.new, with:
#   uv run frwo-tune --algorithm "Superhuman Fairness Neural Network"
#
# Every value not listed under `parameters` comes from
# configs/experiments/main.yaml, merged with configs/base.yaml.
name: Superhuman Fairness Neural Network
project: frwo
method: bayes
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/frwo/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - frwo.sweep
  - trial
run_cap: 40
# How many of this algorithm's trials `frwo-tune` runs at once, across its
# sweeps. If fewer sweeps are left, the spare trials go to the ones that are.
# Each trial's search ignores the results of the `parallel_sweeps - 1` trials
# before it, so changing this changes the results.
parallel_sweeps: 3
parameters:
  ALGORITHMS:
    value: [Superhuman Fairness Neural Network]
  # The reference implementation trains for 30-40 iterations.
  SH_NN_ITERS:
    distribution: int_uniform
    min: 5
    max: 60
  # The network's Adam learning rate; the reference implementation's is 1e-5.
  SH_NN_LR_THETA:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-3
  SH_NN_LAMDA:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 0.1
  # The first hidden layer's width; the second has half as many units. The
  # reference implementation's is 512.
  SH_NN_HIDDEN_NODES:
    values: [64, 128, 256, 512, 1024]
  # Full-batch Adam steps of the initial fit; the reference implementation's
  # is 15000.
  # Widened from a maximum of 20000 after the first sweep's best
  # value landed near it.
  SH_NN_BASE_FIT_EPOCHS:
    distribution: int_uniform
    min: 1000
    max: 40000
  # 1 disables the boost; the reference implementation's is 10.
  SH_NN_LR_BOOST_FACTOR:
    distribution: log_uniform_values
    min: 1.0
    max: 30.0
  # The fraction of the features that must be gamma-superhuman before the
  # boost is undone; the reference implementation's is 0.9.
  # Widened from a maximum of 1.0 after the first sweep's best value landed near
  # it. The gamma-superhuman sum can never exceed the number of features, so
  # every value above 1 means the boost is never undone.
  SH_NN_LR_DECAY_GAMMA_FRAC:
    distribution: uniform
    min: 0.5
    max: 1.1
