# W&B sweep: tunes Superhuman Fairness.
#
# Run this sweep for every selected dataset, and write its best values to
# configs/tuned_hyperparameters.yaml.new, with:
#   uv run frwo-tune --algorithm "Superhuman Fairness"
#
# Every value not listed under `parameters` comes from
# configs/experiments/main.yaml, merged with configs/base.yaml.
name: Superhuman Fairness
project: frwo
method: bayes
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/frwo/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - frwo.sweep
  - trial
run_cap: 40
# How many of this algorithm's trials `frwo-tune` runs at once, across its
# sweeps. If fewer sweeps are left, the spare trials go to the ones that are.
# Each trial's search ignores the results of the `parallel_sweeps - 1` trials
# before it, so changing this changes the results.
parallel_sweeps: 6
parameters:
  ALGORITHMS:
    value: [Superhuman Fairness]
  # The reference implementation's defaults are 30 iterations, a learning
  # rate of 0.01 and lamda 0.001; its COMPAS runs use 5 iterations at 0.0001.
  SH_ITERS:
    distribution: int_uniform
    min: 5
    max: 60
  # Widened from a minimum of 1e-5 after the first sweep's best
  # value landed near it.
  SH_LR_THETA:
    distribution: log_uniform_values
    min: 1.0e-7
    max: 0.1
  # Widened from a minimum of 1e-5 after the first sweep's best
  # value landed near it.
  SH_LAMDA:
    distribution: log_uniform_values
    min: 1.0e-7
    max: 0.1
