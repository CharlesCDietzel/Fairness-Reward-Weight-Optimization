# W&B sweep: tunes Fairness Reward Weight Optimization.
#
# Run this sweep for every selected dataset, and write its best values to
# configs/tuned_hyperparameters.yaml.new, with:
#   uv run frwo-tune --algorithm "Fairness Reward Weight Optimization"
#
# Every value not listed under `parameters` comes from
# configs/experiments/main.yaml, merged with configs/base.yaml.
name: Fairness Reward Weight Optimization
project: frwo
method: bayes
metric:
  # The mean validation subdominance (sum_abs_subdominance_val) of the
  # technique's runs; see src/frwo/sweep.py.
  name: objective
  goal: minimize
command:
  - ${env}
  - ${interpreter}
  - -m
  - frwo.sweep
  - trial
run_cap: 40
# How many of this algorithm's trials `frwo-tune` runs at once, across its
# sweeps. If fewer sweeps are left, the spare trials go to the ones that are.
# Each trial's search ignores the results of the `parallel_sweeps - 1` trials
# before it, so changing this changes the results.
parallel_sweeps: 5
parameters:
  ALGORITHMS:
    value: [Fairness Reward Weight Optimization]
  # The objective scores only the weight-adjusted runs, so the `opt_debias`
  # weight adjustment always runs, whatever main.yaml sets.
  RUN_OPT_DEBIAS:
    value: true
  # Swaps the library and optimizer of every `opt_debias` entry of
  # WEIGHT_ADJUST_LIST, keeping its evaluation budget (see src/frwo/config.py).
  # The best one is written to configs/tuned_hyperparameters.yaml as the
  # dataset's WEIGHT_ADJUST_LIST.
  OPT_DEBIAS_OPTIMIZER:
    values:
      - optuna/GP
      - optuna/SMAC
      - optuna/TPE
      - pybobyqa/Multi-Start BOBYQA
  # The random forest that predicts `y` from `x` for FRWO's policies. The
  # defaults (scikit-learn's) are 100 trees, unlimited depth (null) and 1
  # sample per leaf.
  FRWO_CLF_N_ESTIMATORS:
    values: [50, 100, 200, 400]
  FRWO_CLF_MAX_DEPTH:
    values: [null, 5, 10, 20]
  FRWO_CLF_MIN_SAMPLES_LEAF:
    values: [1, 2, 5, 10, 20, 50]
  # The `alpha` regularization of the subdominance `opt_debias` minimizes.
  # The default is 0.001; the range matches the Superhuman Fairness sweeps'
  # SH_*LAMDA.
  OPT_DEBIAS_LAMDA:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 0.1
