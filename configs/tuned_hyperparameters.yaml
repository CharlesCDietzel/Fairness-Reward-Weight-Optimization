# The hyperparameters `uv run frwo-tune` found, under the settings of
# configs/experiments/main.yaml. Every experiment config runs with them.
#
# Written by `frwo-tune` (as tuned_hyperparameters.yaml.new, for review),
# by dataset and then technique:
#   values:        the best values its sweep found. Fairness Reward Weight
#                  Optimization's best optimizer is written as the
#                  dataset's WEIGHT_ADJUST_LIST, which runs when an
#                  experiment config sets RUN_OPT_DEBIAS.
#   objective:     their mean validation subdominance.
#   sweep:         the W&B sweep that found them.
#   tuned_against: a fingerprint of main.yaml's settings for the dataset
#                  when they were tuned (see `tuning_fingerprint()` in
#                  src/frwo/config.py). `frwo` warns when it no longer
#                  matches. null for values tuned before it was recorded.

